<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery - Final Project</title>
    <!-- Liên kết đến file CSS riêng -->
    <link rel="stylesheet" href="bt2.css">
</head>
<body onload="addTabIndex()">

    <!-- Khung chính hiển thị ảnh phóng to và chữ -->
    <div id="image">
        Hover over or tab through an image below to display here.
    </div>

    <!-- Khu vực chứa các ảnh nhỏ (Grid Container) -->
    <div class="container">
        <figure>
            <img src="../images/cat1.jpg" alt="Mô tả bức ảnh số 1: Phong cảnh thiên nhiên hùng vĩ." onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
            <figcaption>Ảnh 1</figcaption>
        </figure>
        <figure>
            <img src="../images/cat1.jpg" alt="Mô tả bức ảnh số 2: Thành phố về đêm lung linh ánh đèn." onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
            <figcaption>Ảnh 2</figcaption>
        </figure>
        <figure>
            <img src="../images/cat1.jpg" alt="Mô tả bức ảnh số 3: Bãi biển cát trắng nắng vàng." onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
            <figcaption>Ảnh 3</figcaption>
        </figure>
        <figure>
            <img src="../images/cat1.jpg" alt="Mô tả bức ảnh số 4: Ngọn núi tuyết phủ trắng xóa." onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
            <figcaption>Ảnh 4</figcaption>
        </figure>
        <figure>
            <img src="../images/cat1.jpg" alt="Mô tả bức ảnh số 5: Khu rừng mùa thu lá vàng rơi." onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
            <figcaption>Ảnh 5</figcaption>
        </figure>
        <figure>
            <img src="../images/cat1.jpg" alt="Mô tả bức ảnh số 6: Cánh đồng hoa rực rỡ sắc màu." onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
            <figcaption>Ảnh 6</figcaption>
        </figure>
    </div>

    <!-- Liên kết đến file JavaScript riêng -->
    <script src="bt2.js"></script>
</body>
</html>
