<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Interactive Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #image {
            width: 500px;
            height: 300px;
            border: 3px solid #333;
            margin: 0 auto 30px auto;
            background-color: #e9e9e9;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #555;
            font-weight: bold;
        }
        .preview-box {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .preview-box img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border: 2px solid #ccc;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }
        .preview-box img:hover {
            border-color: #007bff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="preview-box">
        <img src="../images/cat1.jpg" alt="Đây là mô tả cho bức ảnh số 1: Chú mèo đáng yêu." onmouseover="upDate(this)" onmouseout="undo()">
        <img src="../images/cat1.jpg" alt="Đây là mô tả cho bức ảnh số 2: Khoảnh khắc thư giãn." onmouseover="upDate(this)" onmouseout="undo()">
        <img src="../images/cat1.jpg" alt="Đây là mô tả cho bức ảnh số 3: Góc nhìn nghệ thuật." onmouseover="upDate(this)" onmouseout="undo()">
    </div>

    <script>
        function upDate(previewPic) {
            console.log("Đã di chuột vào ảnh!");
            console.log("Đường dẫn:", previewPic.src);
            console.log("Mô tả:", previewPic.alt);

            document.getElementById('image').innerHTML = previewPic.alt;

            document.getElementById('image').style.backgroundImage = "url('" + previewPic.src + "')";
        }

        function undo() {
            document.getElementById('image').style.backgroundImage = "url('')";

            document.getElementById('image').innerHTML = "Hover over an image below to display here.";
        }
    </script>

</body>
</html>
